name: TouchV Android build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up JDK 17 (includes javac)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v4

      - name: Install Android 34 build packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Confirm Java compiler
        run: javac -version

      - name: Run TouchV engine tests
        run: ./selftest/run.sh

      - name: Build debug APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Save debug APK
        uses: actions/upload-artifact@v4
        with:
          name: touchv-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
